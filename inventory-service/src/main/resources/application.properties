# Application name
spring.application.name=inventory-service
# MongoDB URI for connection (change as needed for different environments)
spring.data.mongodb.uri=mongodb://localhost:27017/inventoryDataBase
# Server Port (ensure this doesn't conflict with other applications)
server.port=8083

# Exclude DataSource auto-configuration for non-relational databases like MongoDB
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
# Enable all Actuator endpoints
management.endpoints.web.exposure.include=*

# Show detailed info in /info endpoint
management.info.env.enabled=true
# Enable health and metrics details
management.endpoint.health.show-details=always

eureka.client.serviceUrl.defaultZone=http://eureka:password@localhost:8761/eureka
spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability= 1.0